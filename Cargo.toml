[package]
name = "mpu-audit"
version = "0.1.0"
edition = "2021"
description = "Offline MPU configuration auditor for ARMv7-M (Cortex-M4) firmware"
license = "MIT OR Apache-2.0"

[dependencies]
object = { version = "0.40", default-features = false, features = ["read", "std", "elf"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

[profile.release]
opt-level = 2
